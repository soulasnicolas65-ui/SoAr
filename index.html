<!DOCTYPE html>
<html lang="es">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RN9ZDFJZMP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RN9ZDFJZMP');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoAr - Tienda Natural</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Carrito fijo superior -->
  <div class="cart-bar" id="cart-bar-btn">
    <div class="cart-info">
      <span class="cart-icon">🛒</span>
      <span id="cart-count">0 productos</span>
    </div>
    <div class="cart-total-container">
      <span>Total:</span>
      <span id="cart-total">$0</span>
    </div>
  </div>

  <!-- Panel lateral desplegable del carrito -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="drawer-header">
      <h3>Tu Carrito</h3>
      <button class="close-drawer" id="close-drawer">&times;</button>
    </div>
    <div class="drawer-items" id="drawer-items">
      <p class="empty-cart-msg">El carrito está vacío</p>
    </div>
    <div class="drawer-footer">
      <div class="drawer-total-row">
        <span>Total a pagar:</span>
        <span id="drawer-total">$0</span>
      </div>
      <button class="btn-whatsapp" id="btn-whatsapp">Enviar pedido por WhatsApp 📱</button>
    </div>
  </div>
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <header class="header">
    <h1>SoAr</h1>
    <p>TIENDA NATURAL</p>
  </header>

  <!-- BUSCADOR FIJO ARRIBA -->
  <div class="sticky-search-container">
    <div class="search-box">
      <input type="text" id="buscador" placeholder="🔍 Buscar productos o categorías...">
    </div>
  </div>

  <!-- Contenedor principal de la tienda -->
  <main class="container">
    <!-- Grilla donde se cargan los productos -->
    <div class="product-grid" id="grid-productos"></div>
  </main>

  <!-- SOLAPAS DESLIZANTES FIJAS ABAJO AL PIE -->
  <footer class="fixed-footer-tabs">
    <div class="tabs-scroll-container">
     <div class="tabs-wrapper">
  <button class="tab-chip active" data-categoria="todos">Todos</button>
  <button class="tab-chip" data-categoria="condimentos">Condimentos</button>
  <button class="tab-chip" data-categoria="frutos secos">Frutos Secos</button>
  <button class="tab-chip" data-categoria="varios">Otros</button>
</div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
