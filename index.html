<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoAr - Tienda Natural</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Carrito fijo superior -->
    <div class="cart-bar" id="cart-bar-btn">
        <div class="cart-info">
            <span class="cart-icon">🛒</span>
            <span id="cart-count">0 productos</span>
        </div>
        <div class="cart-total-container">
            <span>Total:</span>
            <span id="cart-total">$0</span>
        </div>
    </div>

    <!-- Panel lateral desplegable del carrito -->
    <div class="cart-drawer" id="cart-drawer">
        <div class="drawer-header">
            <h3>Tu Carrito</h3>
            <button class="close-drawer" id="close-drawer">&times;</button>
        </div>
        <div class="drawer-items" id="drawer-items">
            <p class="empty-cart-msg">El carrito está vacío</p>
        </div>
        <div class="drawer-footer">
            <div class="drawer-total-row">
                <span>Total a pagar:</span>
                <span id="drawer-total">$0</span>
            </div>
            <button class="btn-whatsapp" id="btn-whatsapp">Enviar pedido por WhatsApp 📱</button>
        </div>
    </div>
    <div class="drawer-overlay" id="drawer-overlay"></div>

    <header class="header">
        <h1>SoAr</h1>
        <p>TIENDA NATURAL</p>
    </header>

    <main class="container">
        <!-- Barra de búsqueda -->
        <div class="search-box">
            <input type="text" id="buscador" placeholder="🔍 Buscar productos o categorías...">
        </div>

        <!-- Grilla de Tarjetas -->
        <div class="product-grid" id="grid-productos">
            
            <!-- Tarjeta 1 -->
            <div class="card" data-base-price="1500">
                <div class="card-img-container">
                    <span class="category">FRUTOS SECOS</span>
                    <img src="https://images.unsplash.com/photo-1508061253366-f7da15bbf6e4?auto=format&fit=crop&w=400&q=80" alt="Almendras Non Pareil">
                </div>
                <div class="card-content">
                    <h2>Almendras Non Pareil</h2>
                    
                    <div class="options-container">
                        <label>Presentación:</label>
                        <select class="weight-select">
                            <option value="100">100g</option>
                            <option value="250">250g</option>
                            <option value="500">500g</option>
                            <option value="1000" selected>1 kg</option>
                        </select>
                    </div>

                    <div class="price-action">
                        <span class="price product-price">$1.500</span>
                        <button class="btn-add">Agregar</button>
                    </div>
                </div>
            </div>

            <!-- Tarjeta 2 -->
            <div class="card" data-base-price="800">
                <div class="card-img-container">
                    <span class="category">CEREALES</span>
                    <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=400&q=80" alt="Avena Tradicional">
                </div>
                <div class="card-content">
                    <h2>Avena Tradicional</h2>
                    
                    <div class="options-container">
                        <label>Presentación:</label>
                        <select class="weight-select">
                            <option value="100">100g</option>
                            <option value="250">250g</option>
                            <option value="500" selected>500g</option>
                            <option value="1000">1 kg</option>
                        </select>
                    </div>

                    <div class="price-action">
                        <span class="price product-price">$400</span>
                        <button class="btn-add">Agregar</button>
                    </div>
                </div>
            </div>

            <!-- Tarjeta 3 -->
            <div class="card" data-base-price="1200">
                <div class="card-img-container">
                    <span class="category">FRUTOS SECOS</span>
                    <img src="https://images.unsplash.com/photo-1526318896980-cf78c088247c?auto=format&fit=crop&w=400&q=80" alt="Mix Clásico">
                </div>
                <div class="card-content">
                    <h2>Mix Clásico</h2>
                    
                    <div class="options-container">
                        <label>Presentación:</label>
                        <select class="weight-select">
                            <option value="100">100g</option>
                            <option value="250">250g</option>
                            <option value="500">500g</option>
                            <option value="1000" selected>1 kg</option>
                        </select>
                    </div>

                    <div class="price-action">
                        <span class="price product-price">$1.200</span>
                        <button class="btn-add">Agregar</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
