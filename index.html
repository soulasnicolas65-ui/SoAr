
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoAr - Tienda Natural</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>SoAr</h1>
        <p>TIENDA NATURAL</p>
    </header>

    <main class="container">
        <!-- Barra de búsqueda simple -->
        <div class="search-box">
            <input type="text" id="buscador" placeholder="🔍 Buscar productos o categorías...">
        </div>

        <!-- Contenedor de las tarjetas de productos -->
        <div class="product-grid" id="grid-productos">
            <!-- Las tarjetas se cargarán dinámicamente o de forma estática -->
            <div class="card">
                <span class="category">FRUTOS SECOS</span>
                <img src="https://images.unsplash.com/photo-1508061253366-f7da15bbf6e4?auto=format&fit=crop&w=400&q=80" alt="Almendras Non Pareil">
                <div class="card-content">
                    <h2>Almendras Non Pareil</h2>
                    <p class="price">$1.500 <span class="unit">(100g)</span></p>
                </div>
            </div>

            <div class="card">
                <span class="category">CEREALES</span>
                <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=400&q=80" alt="Avena Tradicional">
                <div class="card-content">
                    <h2>Avena Tradicional</h2>
                    <p class="price">$400 <span class="unit">(500g)</span></p>
                </div>
            </div>

            <div class="card">
                <span class="category">FRUTOS SECOS</span>
                <img src="https://images.unsplash.com/photo-1526318896980-cf78c088247c?auto=format&fit=crop&w=400&q=80" alt="Mix Clásico">
                <div class="card-content">
                    <h2>Mix Clásico</h2>
                    <p class="price">$1.200 <span class="unit">(100g)</span></p>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
